<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Boloncity">
  <!--
    El logotipo de Boloncity es horizontal (415x73) y a 16px no se lee. Esta marca
    cuadrada usa los mismos colores: verde urbano de fondo y la B en amarillo
    metropolitano. La B va como trazado vectorial, no como texto, para que se vea
    igual en cualquier sistema aunque no tenga la tipografia instalada.
  -->
